name: iOS · Distribute to Firebase

# Archives, signs and exports an IPA, then ships it to Firebase App Distribution
# on every push to develop (including PR merges), or on manual dispatch.
on:
  push:
   branches:
      - develop
      
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: develop
        type: choice
        options:
          - develop
          - main
          - other (use "Custom branch" below)
      custom_branch:
        description: Custom branch — overrides the dropdown when filled in
        required: false
        type: string
      release_notes:
        description: Notes shown to Firebase testers
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-distribute-${{ github.ref }}-${{ inputs.custom_branch || inputs.branch }}
  cancel-in-progress: false

jobs:
  distribute:
    name: Build & distribute iOS
    # Runs for pushes to develop and manual dispatch. If a pull_request trigger
    # is ever added back, only merged PRs qualify (never a closed-unmerged one).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: macos-14
    timeout-minutes: 75
    environment: firebase-distribution
    env:
      # Firebase App ID for the iOS app (project cocarr-front-end). Not secret.
      FIREBASE_IOS_APP_ID: '1:265614983806:ios:9331015ce8707a7afcce2f'
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'internal-testers' }}
      WORKSPACE: ios/cocarrApp.xcworkspace
      SCHEME: cocarrApp
      BUNDLE_ID: com.iappwiz.cocarr

    steps:
      # GitHub's dispatch dropdown can only hold a fixed list, so "Custom
      # branch" is the escape hatch for feature branches. Precedence:
      # custom_branch > dropdown > the ref that triggered the run (a push).
      # Inputs are interpolated through env, never inlined into the script, so a
      # branch name cannot inject shell.
      - name: Resolve target ref
        id: target
        env:
          PR_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CUSTOM_BRANCH: ${{ inputs.custom_branch }}
          BRANCH_CHOICE: ${{ inputs.branch }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          REF="$PR_SHA"
          [ -n "$REF" ] || REF="$(printf '%s' "$CUSTOM_BRANCH" | tr -d '[:space:]')"
          case "$BRANCH_CHOICE" in other*) BRANCH_CHOICE="" ;; esac
          [ -n "$REF" ] || REF="$BRANCH_CHOICE"
          [ -n "$REF" ] || REF="$TRIGGER_REF"
          if [ -z "$REF" ]; then
            echo "::error::Could not resolve a branch to build."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building from: $REF"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install CocoaPods & fastlane
        working-directory: ios
        run: |
          gem install cocoapods -v 1.15.2 --no-document
          # setup-ruby drops the Homebrew gem path (which has the preinstalled
          # fastlane) from PATH, so install fastlane into the active Ruby.
          gem install fastlane --no-document
          pod install

      - name: Import certificate & regenerate Ad Hoc profile (all devices)
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          # App Store Connect API key — lets fastlane regenerate the Ad Hoc
          # profile with every device currently registered in the account.
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"

          # DECODE, THEN SAY WHICH SECRET IS WRONG.
          #
          # `security import` reports every one of these as the same thing:
          #
          #     MAC verification failed during PKCS12 import (wrong password?)
          #
          # It is emitted for a wrong password AND for a file that is not a
          # valid PKCS#12 at all — so a mangled base64 blob is reported as a
          # password problem, and the obvious response (re-enter the password)
          # cannot fix it. That ambiguity is expensive: the two secrets are
          # re-entered by hand whenever this repo is set up, and neither can be
          # read back to check.
          #
          # Whitespace is stripped first because the base64 is pasted through
          # shells, editors and the GitHub UI, all of which can introduce
          # newlines or a trailing space. `base64 -d` on macOS rejects those,
          # having already truncated the output file.
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | tr -d '[:space:]' | base64 -d > "$CERT_PATH" || {
            echo "::error::IOS_DIST_CERT_P12_BASE64 is not valid base64. Re-create it with: base64 -i dist.p12 | pbcopy"
            exit 1
          }
          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 decoded to an empty file — the secret is empty or truncated."
            exit 1
          fi

          # Is the decoded file a DER structure at all? This is deliberately a
          # STRUCTURE check and involves no password and no cipher support.
          #
          # `openssl pkcs12` is NOT used to validate the password here, however
          # tempting: this runner's PATH puts Homebrew OpenSSL 3 ahead of
          # LibreSSL, and OpenSSL 3 refuses legacy RC2-encrypted .p12 files
          # (the format Keychain Access still exports) without -legacy. It
          # would fail on a perfectly good file with the correct password, and
          # a check that confidently reports the WRONG cause is worse than the
          # ambiguous error it was meant to replace.
          if ! openssl asn1parse -inform DER -in "$CERT_PATH" >/dev/null 2>&1; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 decoded to something that is not a .p12 — it is corrupt, truncated, or double-encoded. Re-create it with: base64 -i dist.p12 | gh secret set IOS_DIST_CERT_P12_BASE64 --repo CoCarr-org/cocarr-app"
            exit 1
          fi
          echo "Decoded a well-formed .p12 ($(wc -c < "$CERT_PATH") bytes)."

          # Create an ephemeral keychain and import the distribution identity
          # (certificate AND private key). Do NOT pass "-t cert": that imports
          # only the certificate and drops the private key, which makes export
          # fail with "No signing certificate ... with a private key".
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # The base64 has already been proven well-formed above, so if this
          # still fails on "MAC verification" the remaining cause is the
          # password — say so, rather than repeating a message that offers
          # "wrong password?" as one of several guesses.
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild || {
            echo "::error::The .p12 decoded cleanly, so IOS_DIST_CERT_PASSWORD does not match this certificate. A TRAILING NEWLINE counts as part of the password — \`echo\` adds one, so set it with printf: printf %s 'thepassword' | gh secret set IOS_DIST_CERT_PASSWORD --repo CoCarr-org/cocarr-app"
            exit 1
          }

          # Import the Apple WWDR intermediate certificates so the distribution
          # cert's chain validates in this ephemeral keychain. Without them the
          # identity imports but is reported as "0 valid identities" and export
          # fails with "No signing certificate ... with a private key".
          for CA in AppleWWDRCAG3 AppleWWDRCAG6 AppleWWDRCAG8; do
            if curl -fsSL -o "$RUNNER_TEMP/$CA.cer" "https://www.apple.com/certificateauthority/$CA.cer"; then
              security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN_PATH" || true
            fi
          done

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Keep the runner's existing keychains (login/system, which hold Apple
          # root CAs) in the search list and add ours; make ours the default.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Sanity check: there must be at least one valid signing identity.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -qE '[1-9][0-9]* valid identities'

          # Regenerate the Ad Hoc provisioning profile so it contains ALL devices
          # currently registered in the Apple Developer account. Once a tester's
          # device is registered (once), every future build includes it, so
          # Firebase stops asking them to register on each push.
          mkdir -p "$RUNNER_TEMP/asc"

          # ACCEPT THE .p8 IN EITHER FORM — base64, or the raw PEM.
          #
          # This file is JSON, and a JSON string cannot contain a literal
          # newline. A raw .p8 is PEM: a BEGIN line, wrapped base64, an END
          # line. Interpolating that straight in produces a multi-line "key"
          # value and fastlane dies in its JSON parser with `unexpected token`
          # — an error that points at neither the secret nor the newline, and
          # that Actions prints with every line masked as *** so the shape of
          # the value cannot even be seen.
          #
          # Both forms are reasonable things to have put in the secret: the
          # file Apple gives you is the PEM, while `is_key_content_base64`
          # wants it encoded. So detect and normalise rather than demanding one.
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "APP_STORE_CONNECT_KEY_P8 holds a raw .p8 — encoding it."
            ASC_KEY_B64="$(printf '%s' "$ASC_KEY_P8_BASE64" | base64 | tr -d '\n')"
          else
            # Already base64. Strip whitespace: `base64` wraps at 76 columns on
            # Linux, and a value pasted through a browser or editor can pick up
            # newlines either way.
            ASC_KEY_B64="$(printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]')"
          fi

          # Round-trip it: the decoded bytes must PARSE as a private key.
          #
          # Deliberately `openssl pkey` and not a grep for the BEGIN line. A
          # truncated paste keeps its opening line — the BEGIN survives, the
          # key does not — so a grep passes it and the failure resurfaces
          # later inside fastlane as an opaque Spaceship error. Parsing is what
          # actually distinguishes a whole key from the start of one.
          if ! printf '%s' "$ASC_KEY_B64" | base64 -d 2>/dev/null | openssl pkey -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 does not decode to a private key. Set it from the file Apple gave you: base64 -i AuthKey_XXXXXXXX.p8 | tr -d '\\n' | gh secret set APP_STORE_CONNECT_KEY_P8 --repo CoCarr-org/cocarr-app"
            exit 1
          fi

          # Built with jq so every value is escaped as JSON rather than pasted
          # into a template — the failure above was a quoting bug, and hand-quoting
          # is what produced it.
          jq -n \
            --arg key_id "$ASC_KEY_ID" \
            --arg issuer_id "$ASC_ISSUER_ID" \
            --arg key "$ASC_KEY_B64" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key,
              is_key_content_base64: true, in_house: false}' \
            > "$RUNNER_TEMP/asc/api_key.json"

          # Prove it parses before fastlane tries to, so a malformed file is
          # reported here with a name attached instead of as a Ruby backtrace.
          jq -e . "$RUNNER_TEMP/asc/api_key.json" >/dev/null || {
            echo "::error::Failed to build a valid App Store Connect api_key.json."
            exit 1
          }
          echo "App Store Connect API key file built and parsed cleanly."

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          fastlane sigh \
            --adhoc \
            --force \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$IOS_TEAM_ID" \
            --api_key_path "$RUNNER_TEMP/asc/api_key.json" \
            --output_path "$RUNNER_TEMP" \
            --filename cocarr_adhoc.mobileprovision
          PROFILE_PATH="$RUNNER_TEMP/cocarr_adhoc.mobileprovision"

          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive (unsigned; signed at export)
        env:
          # Build number, incremented on every develop merge.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Build the archive without signing so that library/Pods targets
          # (ReactCommon, Yoga, …) don't get the app's provisioning profile
          # forced on them. The app is signed during -exportArchive instead.
          # CURRENT_PROJECT_VERSION becomes CFBundleVersion (the build number).
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/cocarrApp.xcarchive" \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/cocarrApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Distribute to Firebase App Distribution
        env:
          # firebase-tools reads FIREBASE_TOKEN automatically for auth, so no
          # service-account file is needed here.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          RELEASE_NOTES: ${{ inputs.release_notes || format('{0} build {1} ({2})', steps.target.outputs.ref, github.run_number, github.sha) }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -n 1)"
          test -n "$IPA_PATH"
          npx --yes firebase-tools@13 appdistribution:distribute \
            "$IPA_PATH" \
            --app "$FIREBASE_IOS_APP_ID" \
            --groups "developers" \
            --release-notes "$RELEASE_NOTES"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocarr-ios-adhoc-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
